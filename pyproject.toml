[project]
name = "mecabite-back"
version = "0.1.0"
description = "Mecabite backend API"
authors = [
    { name = "Bruno Espina", email = "brunoalberto.espina.ce145@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.0",
    "bleak>=1.1.1",
    "joblib>=1.5.2",
    "mediapipe==0.10.35",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.7.2",
]

[project.scripts]
vision = "app.vision.teacher:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
